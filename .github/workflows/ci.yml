name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  architecture-tests:
    name: Architecture and CLI (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - name: Restore locked dependencies
        run: dotnet restore ArchitectureGuardian.slnx --locked-mode
      - name: Build
        run: dotnet build ArchitectureGuardian.slnx --configuration Release --no-restore
      - name: Check formatting
        run: dotnet format ArchitectureGuardian.slnx --verify-no-changes --no-restore
      - name: Test contracts, analysis, architecture boundaries and CLI
        # xUnit v3 uses the VSTest adapter; retain VSTest filtering and TRX reporting.
        # Separate runners keep both heavy suites off each other's critical path without
        # increasing the two-workspace collection limit within either test host.
        run: dotnet test tests/ArchitectureGuardian.ArchitectureTests/ArchitectureGuardian.ArchitectureTests.csproj --configuration Release --no-build --no-restore -m:1 --logger trx --results-directory TestResults
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - name: Install report schema validator
        run: python -m pip install jsonschema==4.26.0
      - name: Validate JSON and SARIF report contracts
        run: python eng/test-reports.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-architecture-${{ matrix.os }}
          path: TestResults/*.trx

  unit-tests:
    name: Unit and compiler tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - name: Restore locked dependencies
        run: dotnet restore ArchitectureGuardian.slnx --locked-mode
      - name: Build
        run: dotnet build ArchitectureGuardian.slnx --configuration Release --no-restore
      - name: Test compiler analyzer
        run: dotnet test tests/ArchitectureGuardian.Analyzers.Tests/ArchitectureGuardian.Analyzers.Tests.csproj --configuration Release --no-build --no-restore -m:1 --logger trx --results-directory TestResults
      - name: Test contracts and workspace analysis
        run: dotnet test tests/ArchitectureGuardian.Tests/ArchitectureGuardian.Tests.csproj --configuration Release --no-build --no-restore -m:1 --logger trx --results-directory TestResults
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-unit-${{ matrix.os }}
          path: TestResults/*.trx

  build-and-test:
    # Preserve the existing required check names. These cannot pass if either
    # test matrix failed, was cancelled, or was skipped on any supported OS.
    name: Build and test (${{ matrix.os }})
    if: ${{ always() }}
    needs: [architecture-tests, unit-tests]
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require both complete test matrices
        env:
          ARCHITECTURE_RESULT: ${{ needs.architecture-tests.result }}
          UNIT_RESULT: ${{ needs.unit-tests.result }}
        run: test "$ARCHITECTURE_RESULT" = success && test "$UNIT_RESULT" = success

  pack-analyzer:
    name: Pack compiler analyzer
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Restore locked analyzer dependencies
        run: dotnet restore src/ArchitectureGuardian.Analyzers --locked-mode
      - name: Build and pack compiler analyzer
        run: dotnet pack src/ArchitectureGuardian.Analyzers --configuration Release --no-restore --output artifacts/analyzers
      - uses: actions/upload-artifact@v4
        with:
          name: compiler-analyzer
          path: artifacts/analyzers/*.nupkg

  compiler-hosts:
    name: Compiler host (${{ matrix.os }})
    needs: pack-analyzer
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        id: dotnet
        with:
          global-json-file: global.json
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - uses: actions/download-artifact@v4
        with:
          name: compiler-analyzer
          path: artifacts/analyzers
      - name: Verify packaged analyzer in an isolated SDK consumer
        run: python eng/test-analyzer-package.py artifacts/analyzers/ArchitectureGuardian.Analyzers.0.1.0.nupkg --sdk ${{ steps.dotnet.outputs.dotnet-version }}
