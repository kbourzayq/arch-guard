name: CI

on:
  workflow_call:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  architecture-tests:
    name: Architecture and CLI (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - name: Restore locked dependencies
        run: dotnet restore ArchitectureGuardian.slnx --locked-mode
      - name: Build
        run: dotnet build ArchitectureGuardian.slnx --configuration Release --no-restore
      - name: Check formatting
        run: dotnet format ArchitectureGuardian.slnx --verify-no-changes --no-restore
      - name: Test contracts, analysis, architecture boundaries and CLI
        # xUnit v3 uses the VSTest adapter; retain VSTest filtering and TRX reporting.
        # Separate runners keep both heavy suites off each other's critical path without
        # increasing the two-workspace collection limit within either test host.
        run: dotnet test tests/ArchitectureGuardian.ArchitectureTests/ArchitectureGuardian.ArchitectureTests.csproj --configuration Release --no-build --no-restore -m:1 --logger trx --results-directory TestResults
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - name: Install report schema validator
        run: python -m pip install jsonschema==4.26.0
      - name: Validate JSON and SARIF report contracts
        run: python eng/test-reports.py
      - name: Verify independent CI gates and failure artifacts
        run: python eng/test-quality-gate.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-architecture-${{ matrix.os }}
          path: TestResults/*.trx

  unit-tests:
    name: Unit and compiler tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - name: Restore locked dependencies
        run: dotnet restore ArchitectureGuardian.slnx --locked-mode
      - name: Build
        run: dotnet build ArchitectureGuardian.slnx --configuration Release --no-restore
      - name: Test compiler analyzer
        run: dotnet test tests/ArchitectureGuardian.Analyzers.Tests/ArchitectureGuardian.Analyzers.Tests.csproj --configuration Release --no-build --no-restore -m:1 --logger trx --results-directory TestResults
      - name: Test contracts and workspace analysis
        run: dotnet test tests/ArchitectureGuardian.Tests/ArchitectureGuardian.Tests.csproj --configuration Release --no-build --no-restore -m:1 --logger trx --results-directory TestResults
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-unit-${{ matrix.os }}
          path: TestResults/*.trx

  build-and-test:
    # Preserve the existing required check names. These cannot pass if either
    # test or package-consumer matrix failed, was cancelled, or was skipped.
    name: Build and test (${{ matrix.os }})
    if: ${{ always() }}
    needs: [architecture-tests, unit-tests, package-consumers]
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require complete test and package-consumer matrices
        env:
          ARCHITECTURE_RESULT: ${{ needs.architecture-tests.result }}
          UNIT_RESULT: ${{ needs.unit-tests.result }}
          PACKAGE_RESULT: ${{ needs.package-consumers.result }}
        run: test "$ARCHITECTURE_RESULT" = success && test "$UNIT_RESULT" = success && test "$PACKAGE_RESULT" = success

  pack-distribution:
    name: Pack distribution
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - name: Pack and verify reproducible distribution payloads
        run: python eng/packages.py pack
      - uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: |
            artifacts/packages/*.nupkg
            artifacts/packages/SHA256SUMS
          if-no-files-found: error

  package-consumers:
    name: Package consumer (${{ matrix.os }})
    needs: pack-distribution
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - uses: actions/download-artifact@v4
        with:
          name: nuget-packages
          path: artifacts/packages
      - name: Verify clean tool installation, CLI and MCP scans, and compiler consumer
        run: python eng/packages.py smoke
