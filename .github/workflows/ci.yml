name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Restore locked dependencies
        run: dotnet restore ArchitectureGuardian.slnx --locked-mode
      - name: Build
        run: dotnet build ArchitectureGuardian.slnx --configuration Release --no-restore
      - name: Check formatting
        run: dotnet format ArchitectureGuardian.slnx --verify-no-changes --no-restore
      - name: Test contracts, analysis, architecture boundaries and CLI
        run: dotnet test ArchitectureGuardian.slnx --configuration Release --no-build --no-restore
