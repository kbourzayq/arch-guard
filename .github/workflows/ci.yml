name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Restore locked dependencies
        run: dotnet restore ArchitectureGuardian.slnx --locked-mode
      - name: Build
        run: dotnet build ArchitectureGuardian.slnx --configuration Release --no-restore
      - name: Check formatting
        run: dotnet format ArchitectureGuardian.slnx --verify-no-changes --no-restore
      - name: Test contracts, analysis, architecture boundaries and CLI
        # xUnit v3 uses the VSTest adapter; retain VSTest filtering and TRX reporting.
        # Each assembly already runs bounded parallel scenarios; avoid multiplying workspace builds across test hosts.
        run: dotnet test ArchitectureGuardian.slnx --configuration Release --no-build --no-restore -m:1 --logger trx --results-directory TestResults
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.os }}
          path: TestResults/*.trx

  pack-analyzer:
    name: Pack compiler analyzer
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Restore locked analyzer dependencies
        run: dotnet restore src/ArchitectureGuardian.Analyzers --locked-mode
      - name: Build and pack compiler analyzer
        run: dotnet pack src/ArchitectureGuardian.Analyzers --configuration Release --no-restore --output artifacts/analyzers
      - uses: actions/upload-artifact@v4
        with:
          name: compiler-analyzer
          path: artifacts/analyzers/*.nupkg

  compiler-hosts:
    name: Compiler host (${{ matrix.os }}, SDK ${{ matrix.sdk }})
    needs: pack-analyzer
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        sdk: ['8.0.100', '9.0.100', '10.0.402']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ matrix.sdk }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - uses: actions/download-artifact@v4
        with:
          name: compiler-analyzer
          path: artifacts/analyzers
      - name: Verify packaged analyzer in an isolated SDK consumer
        run: python eng/test-analyzer-package.py artifacts/analyzers/ArchitectureGuardian.Analyzers.0.1.0.nupkg --sdk ${{ matrix.sdk }}
